[workspace]
members = ["siglet", "siglet-tck", "e2e"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
authors = ["Enrico Risa <enrico.risa@gmail.com>", "Jim Marino <jim.marino@gmail.com>"]
repository = "https://github.com/eclipse-dataplane-core/siglet"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
bon = "3.9.1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = "11"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
# `json` is not a default feature but is required for `cel::Value::json()`, which converts
# evaluation results back into `serde_json::Value` for the JWT claim map.
cel = { version = "0.15.0", features = ["json"] }

[workspace.lints.clippy]
unwrap_used = "deny"
