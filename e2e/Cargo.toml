[package]
name = "siglet-e2e-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "consumer-did-setup"
path = "src/bin/consumer_did_setup.rs"

[dependencies]
tokio = { workspace = true }
anyhow = "1.0"
base64 = { workspace = true }
dsdk-facet-testcontainers = "0.1.1"
dsdk-facet-core = { version = "0.1.1", features = ["test-fixtures"] }
dsdk-facet-hashicorp-vault = "0.1.1"
uuid = { workspace = true }
serde_json = { workspace = true }
reqwest = "0.12"
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }

[dev-dependencies]

[features]
# Feature flag to enable E2E tests
# Run with: cargo test --package siglet-e2e-tests --features e2e
e2e = []
